{% if form.non_field_errors %}
    <ul class="errors">
        {% for error in form.non_field_errors %}
            <li>{{ error }}</li>
        {% endfor %}
    </ul>
{% endif %}
{% for field in form %}
    {% if field.errors %}
        <ul class="errors">
            {% for error in field.errors %}
                <li>{{ field.label }}: {{ error }}</li>
            {% endfor %}
        </ul>
    {% endif %}
{% endfor %}
